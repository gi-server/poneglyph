version: '3.8'

services:
  db:
    image: mongo:7.0
    container_name: docunest_db
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-poneglyph}
    ports:
      # Bind only to localhost — do not expose MongoDB to external interfaces
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
    # Resource limits to prevent a runaway container from exhausting host memory
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

volumes:
  mongodata:

