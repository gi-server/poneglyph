{{ define "documents" }}
<!-- Documents Content -->
<div x-show="currentPath === '/documents'" x-data="documentsView()" x-init="initView()"
    class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
        <h3 class="text-xl font-bold">Recent Documents</h3>
        <button @click="fetch('/api/documents').then(r => r.json()).then(d => documents = d)"
            class="text-sm text-secondary hover:text-indigo-800 font-medium flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                </path>
            </svg>
            Refresh
        </button>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
            <thead class="bg-gray-50 text-gray-500 font-medium">
                <tr>
                    <th class="px-6 py-4">Document</th>
                    <th class="px-6 py-4">Status</th>
                    <th class="px-6 py-4">Type</th>
                    <th class="px-6 py-4">Entity</th>
                    <th class="px-6 py-4">Customer</th>
                    <th class="px-6 py-4">Date</th>
                    <th class="px-6 py-4 text-right">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                <template x-for="doc in documents" :key="doc.id">
                    <tr class="hover:bg-gray-50 transition">
                        <td class="px-6 py-4">
                            <div class="font-medium text-gray-900" x-text="doc.original_name"></div>
                            <div class="text-xs text-gray-500" x-text="'ID: ' + doc.id"></div>
                        </td>
                        <td class="px-6 py-4">
                            <span
                                class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium capitalize"
                                :class="{
                                                  'bg-blue-100 text-blue-800': doc.status === 'uploaded',
                                                  'bg-yellow-100 text-yellow-800': doc.status === 'processing',
                                                  'bg-orange-100 text-orange-800': doc.status === 'needs_review',
                                                  'bg-green-100 text-green-800': doc.status === 'completed',
                                                  'bg-red-100 text-red-800': doc.status === 'failed'
                                              }" x-text="doc.status.replace('_', ' ')">
                            </span>
                        </td>
                        <td class="px-6 py-4 text-gray-500" x-text="doc.document_type || '-'"></td>
                        <td class="px-6 py-4 text-gray-500" x-text="(doc.extracted_data?.vendor || doc.extracted_data?.merchant || doc.extracted_data?.person_name || doc.person_name || '-')"></td>
                        <td class="px-6 py-4 text-gray-900 font-medium"
                            x-text="doc.customer_name || (doc.status === 'needs_review' ? 'Pending Review' : 'New')">
                        </td>
                        <td class="px-6 py-4 text-gray-500" x-text="new Date(doc.created_at).toLocaleDateString()"></td>
                        <td class="px-6 py-4 text-right flex justify-end gap-2">
                            <button x-show="doc.status === 'needs_review'" @click="openReviewModal(doc)"
                                class="text-sm bg-orange-100 text-orange-700 px-3 py-1.5 rounded-lg hover:bg-orange-200 font-medium transition">Review</button>
                        </td>
                    </tr>
                </template>
                <tr x-show="documents == null || documents.length === 0">
                    <td colspan="6" class="px-6 py-8 text-center text-gray-500">No documents found.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Review Modal -->
    <div x-show="reviewModalOpen" style="display: none;" class="fixed inset-0 z-50 overflow-y-auto"
        aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" @click="reviewModalOpen = false">
            </div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div
                class="inline-block align-bottom bg-white rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <h3 class="text-lg leading-6 font-bold text-gray-900" id="modal-title">Review AI Extraction</h3>
                    <div class="mt-2">
                        <p class="text-sm text-gray-500 mb-6">Please verify the AI's classification before completing.
                        </p>

                        <div class="space-y-4 text-left">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Document Type</label>
                                <input type="text" x-model="reviewDoc.document_type"
                                    class="mt-1 w-full border rounded-lg px-3 py-2">
                            </div>
                            <!-- Dynamic extracted fields -->
                            <template x-for="key in Object.keys(reviewDoc._extracted_data || {})" :key="key">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700"
                                        x-text="key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase())"></label>
                                    <input type="text" x-model="reviewDoc._extracted_data[key]"
                                        class="mt-1 w-full border rounded-lg px-3 py-2">
                                </div>
                            </template>

                            <div class="pt-2">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Customer Assignment</label>
                                <div class="grid grid-cols-2 gap-2 mb-2">
                                    <button type="button"
                                        @click="reviewCustomerType = 'new'; reviewSearchQuery = ''; reviewSelectedCustomer = null"
                                        :class="reviewCustomerType === 'new' ? 'bg-secondary text-white' : 'bg-gray-100 text-gray-700'"
                                        class="px-3 py-2 rounded-lg text-sm font-medium">Create New</button>
                                    <button type="button" @click="reviewCustomerType = 'existing'"
                                        :class="reviewCustomerType === 'existing' ? 'bg-secondary text-white' : 'bg-gray-100 text-gray-700'"
                                        class="px-3 py-2 rounded-lg text-sm font-medium">Link Existing</button>
                                </div>

                                <div x-show="reviewCustomerType === 'existing'" class="relative">
                                    <input type="text" x-model="reviewSearchQuery"
                                        @input.debounce.300ms="searchReviewCustomers" placeholder="Search customers..."
                                        class="w-full border rounded-lg px-3 py-2">

                                    <div x-show="reviewCustomers.length > 0 && reviewSearchQuery.length > 0"
                                        class="absolute z-10 w-full mt-1 bg-white border border-gray-200 rounded-lg shadow-lg max-h-40 overflow-y-auto">
                                        <template x-for="c in reviewCustomers" :key="c.id">
                                            <div @click="selectReviewCustomer(c)"
                                                class="px-4 py-2 hover:bg-gray-50 cursor-pointer border-b last:border-0 text-sm">
                                                <div class="font-medium" x-text="c.name"></div>
                                            </div>
                                        </template>
                                    </div>

                                    <div x-show="reviewSelectedCustomer"
                                        class="mt-2 text-sm text-green-700 flex items-center justify-between bg-green-50 px-3 py-2 rounded">
                                        <span x-text="'Linked to: ' + reviewSelectedCustomer?.name"></span>
                                        <button @click="reviewSelectedCustomer = null; reviewSearchQuery = ''"
                                            class="font-bold text-green-800">×</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 flex justify-end gap-3">
                    <button type="button" @click="reviewModalOpen = false"
                        class="inline-flex justify-center rounded-lg border border-gray-300 shadow-sm px-4 py-2 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50">
                        Cancel
                    </button>
                    <button type="button" @click="submitReview"
                        :disabled="submittingReview || (reviewCustomerType === 'existing' && !reviewSelectedCustomer)"
                        class="inline-flex justify-center rounded-lg border border-transparent shadow-sm px-4 py-2 bg-secondary text-sm font-medium text-white hover:bg-opacity-90 disabled:opacity-50">
                        <span x-show="!submittingReview">Confirm & Save</span>
                        <span x-show="submittingReview">Saving...</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>


{{ end }}
